---
- name: Check if ArgoCD is already installed
  shell: helm list -n argocd --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml" -q | grep -q "^argocd$"
  register: argocd_check
  failed_when: false
  changed_when: false
  delegate_to: localhost
  run_once: true

- name: Add ArgoCD Helm repo
  shell: helm repo add argo https://argoproj.github.io/argo-helm
  delegate_to: localhost
  run_once: true
  when: argocd_check.rc != 0

- name: Update Helm repos
  shell: helm repo update
  delegate_to: localhost
  run_once: true
  when: argocd_check.rc != 0

- name: Install ArgoCD
  shell: |
    helm upgrade --install argocd argo/argo-cd \
      --version {{ argocd_version }} \
      --namespace argocd \
      --create-namespace \
      --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml" \
      -f "{{ role_path }}/argocd-values.yml" \
      --wait
  delegate_to: localhost
  run_once: true

- name: Update ArgoCD admin password from Vault
  shell: |
    kubectl patch secret argocd-secret -n argocd \
      --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml" \
      -p '{"stringData": {"admin.password": "{{ vault_argocd_admin_password_hash }}", "admin.passwordMtime": "'$(date +%FT%T%Z)'"}}'
  delegate_to: localhost
  run_once: true
  when: vault_argocd_admin_password_hash is defined

- name: Apply App Project
  shell: |
    kubectl apply -f "{{ playbook_dir }}/../../../gitops/projects/infra.yml" \
      --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml"
  delegate_to: localhost
  run_once: true

- name: Bootstrap GitOps (App of Apps)
  shell: |
    kubectl apply -f "{{ playbook_dir }}/../../../gitops/apps/app-of-apps/application.yml" \
      --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml"
  delegate_to: localhost
  run_once: true

- name: Get ArgoCD admin password
  shell: |
    kubectl get secret argocd-initial-admin-secret -n argocd \
      --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml" \
      -o jsonpath="{.data.password}" | base64 -d
  register: argocd_password
  delegate_to: localhost
  run_once: true

- name: Save ArgoCD password to file
  copy:
    content: "{{ argocd_password.stdout }}"
    dest: "{{ playbook_dir }}/../argocd-password.txt"
  delegate_to: localhost
  run_once: true

- name: Ensure argocd-password.txt is ignored by git
  lineinfile:
    path: "{{ playbook_dir }}/../.gitignore"
    line: "argocd-password.txt"
    create: yes
  delegate_to: localhost
  run_once: true
