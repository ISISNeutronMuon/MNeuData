---
- name: Install ArgoCD
  shell: |
    kubectl create namespace argocd --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml"
    kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.5/manifests/install.yaml --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml"
  delegate_to: localhost
  run_once: true

- name: Update ArgoCD admin password from Vault
  shell: |
    kubectl patch secret argocd-secret -n argocd \
      --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml" \
      -p '{"stringData": {"admin.password": "{{ vault_argocd_admin_password_hash }}", "admin.passwordMtime": "'$(date +%FT%T%Z)'"}}'
  delegate_to: localhost
  run_once: true
  when: vault_argocd_admin_password_hash is defined

- name: Apply App Project
  shell: |
    kubectl apply -f "{{ playbook_dir }}/../../../gitops/projects/infra.yml" \
      --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml"
  delegate_to: localhost
  run_once: true

- name: Register MNeuData repository in ArgoCD
  shell: |
    kubectl apply --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml" -f - <<EOF
    {{ {
      'apiVersion': 'v1',
      'kind': 'Secret',
      'metadata': {
        'name': 'mneudata-repo',
        'namespace': 'argocd',
        'labels': {
          'argocd.argoproj.io/secret-type': 'repository'
        }
      },
      'stringData': {
        'type': 'git',
        'url': 'git@github.com:ISISNeutronMuon/MNeuData.git',
        'sshPrivateKey': vault_argocd_repo_ssh_key
      }
    } | to_nice_yaml }}
    EOF
  delegate_to: localhost
  run_once: true
  when: vault_argocd_repo_ssh_key is defined

- name: Bootstrap GitOps (App of Apps)
  shell: |
    kubectl apply -f "{{ playbook_dir }}/../../../gitops/apps/app-of-apps/application.yml" \
      --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml"
  delegate_to: localhost
  run_once: true

- name: Get ArgoCD admin password
  shell: |
    kubectl get secret argocd-initial-admin-secret -n argocd \
      --kubeconfig "{{ playbook_dir }}/../kubeconfig.yaml" \
      -o jsonpath="{.data.password}" | base64 -d
  register: argocd_password
  delegate_to: localhost
  run_once: true

- name: Save ArgoCD password to file
  copy:
    content: "{{ argocd_password.stdout }}"
    dest: "{{ playbook_dir }}/../argocd-password.txt"
  delegate_to: localhost
  run_once: true

- name: Ensure argocd-password.txt is ignored by git
  lineinfile:
    path: "{{ playbook_dir }}/../.gitignore"
    line: "argocd-password.txt"
    create: yes
  delegate_to: localhost
  run_once: true
