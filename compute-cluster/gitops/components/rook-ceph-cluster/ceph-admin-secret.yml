apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: rook-ceph-mon
  namespace: rook-ceph
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth

  mount: isis-compute-cluster
  path: rook-ceph/admin
  destination:
    name: rook-ceph-mon
    overwrite: true
    create: true