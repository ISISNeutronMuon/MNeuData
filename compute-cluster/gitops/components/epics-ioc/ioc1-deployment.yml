apiVersion: apps/v1
kind: Deployment
metadata:
  name: epics-ioc-1
  namespace: epics-test
  labels:
    app.kubernetes.io/name: epics-ioc-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: epics-ioc-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epics-ioc-1
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: talos-12a-ewd
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ioc
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        command: ["/bin/sh", "-c"]
        args:
        - "pip install --no-cache-dir --target /tmp/pkg epicscorelibs && exec python -u -c 'from epicscorelibs.ioc import start_ioc; import signal; start_ioc(database=\"/config/records.db\"); signal.pause()'"
        env:
        - name: HOME
          value: "/tmp"
        - name: PYTHONPATH
          value: "/tmp/pkg"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: EPICS_CAS_INTF_ADDR_LIST
          value: "130.246.55.51"
        - name: EPICS_CA_SERVER_PORT
          value: "5064"
        - name: EPICS_CA_REPEATER_PORT
          value: "5065"
        volumeMounts:
        - name: records
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: records
        configMap:
          name: ioc1-records
      - name: tmp
        emptyDir: {}
