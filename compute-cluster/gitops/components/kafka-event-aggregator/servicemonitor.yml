apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kafka-event-aggregator
  namespace: epics-test
  labels:
    app.kubernetes.io/name: kafka-event-aggregator
spec:
  endpoints:
  - port: metrics
    path: /metrics
    interval: 60s
    scrapeTimeout: 10s
    scheme: http
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
    - epics-test
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-event-aggregator
