apiVersion: v1
kind: Service
metadata:
  name: s3-exporter
  namespace: monitoring-system
  labels:
    app.kubernetes.io/name: s3-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: s3-exporter
  ports:
  - name: metrics
    port: 8000
    targetPort: metrics
    protocol: TCP
