apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: grafana-db-creds
  namespace: grafana
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth

  mount: isis-compute-cluster
  path: grafana/host/database
  destination:
    name: grafana-db-creds
    overwrite: true
    create: true
