apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mimir-basic-auth
  namespace: monitoring-system
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth

  mount: isis-compute-cluster
  path: monitoring/mimir-basic-auth
  destination:
    name: mimir-basic-auth
    overwrite: true
    create: true