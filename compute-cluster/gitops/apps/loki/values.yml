loki:
  compactor:
    retention_enabled: true
    compaction_interval: 10m
    retention_delete_delay: 2h
    delete_request_store: s3
  limits_config:
    max_query_lookback: 1440h # 28 days
    allow_structured_metadata: true
    volume_enabled: true
    max_line_size_truncate: true
    retention_period: 1440h  # 60 days default
  storage:
    bucketNames:
      chunks: loki-s3
      ruler: loki-ruler-s3
    s3:
      accessKeyId: ${S3_ACCESS_KEY_ID}
      secretAccessKey: ${S3_SECRET_ACCESS_KEY}
      endpoint: versitygw.versitygw.svc.cluster.local:7070
      region: us-east-1
      s3ForcePathStyle: true #Required to make our S3 compatability work
  ingester:
    chunk_encoding: snappy
  querier:
    max_concurrent: 8
    multi_tenant_queries_enabled: true
  pattern_ingester:
    enabled: true

deploymentMode: Distributed

ingester:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 60
  zoneAwareReplication:
     enabled: false
  extraArgs:
    - '-config.expand-env=true'
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: versity-s3-root
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: versity-s3-root
          key: S3_SECRET_ACCESS_KEY
querier:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 60
  maxUnavailable: 2
  extraArgs:
    - '-config.expand-env=true'
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: versity-s3-root
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: versity-s3-root
          key: S3_SECRET_ACCESS_KEY
queryFrontend:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 60
  maxUnavailable: 1
queryScheduler:
  replicas: 1
distributor:
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 60
  maxUnavailable: 2
compactor:
  replicas: 1
  extraArgs:
    - '-config.expand-env=true'
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: versity-s3-root
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: versity-s3-root
          key: S3_SECRET_ACCESS_KEY
indexGateway:
  replicas: 1
  maxUnavailable: 1
  extraArgs:
    - '-config.expand-env=true'
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: versity-s3-root
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: versity-s3-root
          key: S3_SECRET_ACCESS_KEY

bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
backend:
   replicas: 0
read:
   replicas: 0
write:
   replicas: 0
singleBinary:
   replicas: 0
minio:
  enabled: false

gateway:
  enabled: true

monitoring:
  serviceMonitor:
    enabled: true

lokiCanary:
  extraArgs:
    - -pass=$(LOKI_PASS)
    - -user=self-monitoring
  extraEnv:
    - name: LOKI_PASS
      valueFrom:
        secretKeyRef:
          name: loki-auth
          key: SELF_MONITORING_PASSWORD