apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-event-aggregator
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  source:
    repoURL: git@github.com:ISISNeutronMuon/MNeuData.git
    targetRevision: compute_cluster
    path: compute-cluster/gitops/components/kafka-event-aggregator
  destination:
    server: https://kubernetes.default.svc
    namespace: epics-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
