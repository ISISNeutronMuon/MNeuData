apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: versitygw
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: infra
  sources:
  - repoURL: oci://ghcr.io/versity/versitygw/charts/versitygw
    chart: versitygw
    targetRevision: 0.3.5
    helm:
      valueFiles:
      - $values/compute-cluster/gitops/apps/versitygw/values.yml
  - repoURL: git@github.com:ISISNeutronMuon/MNeuData.git
    targetRevision: compute_cluster
    ref: values
  - repoURL: git@github.com:ISISNeutronMuon/MNeuData.git
    targetRevision: compute_cluster
    path: compute-cluster/gitops/components/versitygw
  destination:
    server: https://kubernetes.default.svc
    namespace: versitygw-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
