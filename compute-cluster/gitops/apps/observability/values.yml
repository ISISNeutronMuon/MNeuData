cluster:
  name: MNeudata-Compute

destinations:
  - name: metrics-service
    type: prometheus
    url: https://mimir.compute.isis.cclrc.ac.uk/mneudata/api/v1/push
    auth:
      type: basic
      usernameKey: username
      passwordKey: password
    secret:
      create: false
      name: mimir-basic-auth
      namespace: monitoring-system

  - name: logs-service
    type: loki
    url: https://loki.compute.isis.cclrc.ac.uk/mneudata/loki/api/v1/push
    auth:
      type: basic
      usernameKey: username
      passwordKey: password
    secret:
      create: false
      name: loki-basic-auth
      namespace: monitoring-system

  - name: traces-service
    type: otlp
    protocol: http
    url: https://tempo.compute.isis.cclrc.ac.uk/mneudata
    auth:
      type: basic
      usernameKey: username
      passwordKey: password
    secret:
      create: false
      name: tempo-basic-auth
      namespace: monitoring-system
    metrics: {enabled: true}
    logs: {enabled: true}
    traces: {enabled: true}

annotationAutodiscovery:
  enabled: true
  namespaces: [argocd, cert-manager, default, loki, mimir, monitoring-system, tempo, vault-secrets-operator-system, versitygw-system]

applicationObservability:
  enabled: true
  receivers:
    otlp:
      grpc:
        enabled: true
        port: 4317
      http:
        enabled: true
        port: 4318
  metrics:
    filters:
      metric:
        - IsMatch(resource.attributes["k8s.namespace.name"], "^argocd|cert-manager|default|loki|mimir|monitoring-system|tempo|vault-secrets-operator-system|versitygw-system$")
      logs:
        - IsMatch(resource.attributes["k8s.namespace.name"], "^argocd|cert-manager|default|loki|mimir|monitoring-system|tempo|vault-secrets-operator-system|versitygw-system$")
      traces:
        - IsMatch(resource.attributes["k8s.namespace.name"], "^argocd|cert-manager|default|loki|mimir|monitoring-system|tempo|vault-secrets-operator-system|versitygw-system$")

autoInstrumentation:
  enabled: false

clusterEvents:
  enabled: true
  namespaces: [argocd, cert-manager, default, loki, mimir, monitoring-system, tempo, vault-secrets-operator-system, versitygw-system]

clusterMetrics:
  enabled: true
  cadvisor:
    metricsTuning:
      includeNamespaces: [argocd, cert-manager, default, loki, mimir, monitoring-system, tempo, vault-secrets-operator-system, versitygw-system]
  kube-state-metrics:
    namespaces: [argocd, cert-manager, default, loki, mimir, monitoring-system, tempo, vault-secrets-operator-system, versitygw-system]

podLogs:
  enabled: true
  namespaces: [argocd, cert-manager, default, loki, mimir, monitoring-system, tempo, vault-secrets-operator-system, versitygw-system]

profiling:
  enabled: false

prometheusOperatorObjects:
  enabled: true
  crds:
    deploy: true
  probes:
    namespaces: [argocd, cert-manager, default, loki, mimir, monitoring-system, tempo, vault-secrets-operator-system, versitygw-system]
  podMonitors:
    namespaces: [argocd, cert-manager, default, loki, mimir, monitoring-system, tempo, vault-secrets-operator-system, versitygw-system]
  serviceMonitors:
    namespaces: [argocd, cert-manager, default, loki, mimir, monitoring-system, tempo, vault-secrets-operator-system, versitygw-system]

alloy-metrics:
  enabled: true
