[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "isis-archive"
version = "0.1.0"
description = "Utility code for interacting with the ISIS archive."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.16.0"]
hdf4 = ["pyhdf>=0.11"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyfakefs>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
