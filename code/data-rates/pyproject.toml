[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "isis-archive"
version = "0.1.0"
description = "Utility code for interacting with the ISIS archive."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
#    "pyhdf==0.11.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyfakefs>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
